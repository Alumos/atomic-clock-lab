name: Verify and publish atomic clock lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-assets.py
      - run: node --test scripts/model.test.cjs
      - name: Build and start container
        run: |
          docker compose -f compose.build.yaml config --quiet
          docker compose -f compose.build.yaml up -d --build
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18083/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18083/healthz
          curl -fsS http://127.0.0.1:18083/ | grep -q '任务二：原子钟揭秘'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify browser interactions
        env:
          CLOCK_TEST_URL: http://127.0.0.1:18083/
        run: node scripts/browser-smoke.cjs
      - name: Container diagnostics
        if: always()
        run: |
          docker compose -f compose.build.yaml logs
          docker compose -f compose.build.yaml down

  publish:
    name: Build and publish image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alumos/atomic-clock-lab
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Published image
        run: |
          echo 'Image: `ghcr.io/alumos/atomic-clock-lab:latest`' >> "$GITHUB_STEP_SUMMARY"
          echo 'VPS: `docker compose pull && docker compose up -d` (port 18083)' >> "$GITHUB_STEP_SUMMARY"
